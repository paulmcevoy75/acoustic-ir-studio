name: Test, build and release

# Every push and pull request: lint + tests (Linux and Windows) + a Windows build check.
# Pushes to main also publish a numbered release (v1.<run number>); earlier releases are kept.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb libportaudio2
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check irstudio tests acoustic_ir_studio.py
      - name: Tests (including the app on a fake sound card)
        run: xvfb-run -a pytest -q -rs

  build-windows:
    needs: test-linux
    runs-on: windows-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install (exact versions)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt -r requirements-dev.txt

      - name: Tests on Windows
        run: pytest -q -rs

      - name: Build AcousticIRStudio.exe
        run: >
          pyinstaller --noconfirm --onedir --windowed --name AcousticIRStudio
          --collect-all _sounddevice_data --collect-all _soundfile_data --collect-all imageio_ffmpeg
          --hidden-import pycaw --collect-submodules comtypes
          acoustic_ir_studio.py

      - name: Add data files + version stamp
        id: info
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md dist/AcousticIRStudio/
          Copy-Item docs/USER_GUIDE.md dist/AcousticIRStudio/USER_GUIDE.md
          $version = "1.${{ github.run_number }}"
          $info = @{ version = $version; commit = "${{ github.sha }}".Substring(0, 7); date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm") + " UTC" }
          $info | ConvertTo-Json | Set-Content -Encoding utf8 dist/AcousticIRStudio/build_info.json
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check the packaged app starts (opens every tab, builds a test IR, closes)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/AcousticIRStudio/AcousticIRStudio.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content dist/AcousticIRStudio/logs/app.log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "Self-test failed (exit $($p.ExitCode))"; exit 1 }
          Remove-Item -Recurse -Force dist/AcousticIRStudio/logs -ErrorAction SilentlyContinue

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/AcousticIRStudio -DestinationPath AcousticIRStudio-windows.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 3
          name: AcousticIRStudio-windows
          path: AcousticIRStudio-windows.zip

  build-mac:
    needs: test-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest        # Apple Silicon (M1 and later)
            arch: apple-silicon
            optional: false
          - runner: macos-15-intel      # older Intel Macs
            arch: intel
            optional: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install (exact versions)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt -r requirements-dev.txt

      - name: Tests on macOS
        run: pytest -q -rs

      - name: Build the Mac app
        run: |
          pyinstaller --noconfirm --onedir --windowed --name AcousticIRStudio \
            --osx-bundle-identifier com.paulmcevoyguitars.acousticirstudio \
            --collect-all _sounddevice_data --collect-all _soundfile_data --collect-all imageio_ffmpeg \
            acoustic_ir_studio.py
          APP=dist/AcousticIRStudio.app
          # macOS only lets an app use the microphone / audio inputs if it says why
          plutil -insert NSMicrophoneUsageDescription -string \
            "Acoustic IR Studio records your instrument and microphones to build impulse responses." \
            "$APP/Contents/Info.plist"
          printf '{"version": "1.%s", "commit": "%s", "date": "%s UTC"}' "${{ github.run_number }}" \
            "${GITHUB_SHA::7}" "$(date -u '+%Y-%m-%d %H:%M')" > "$APP/Contents/MacOS/build_info.json"
          codesign --force --deep --sign - "$APP"      # ad-hoc signature (required on Apple Silicon)

      - name: Check the packaged app starts (opens every tab, builds a test IR, closes)
        run: |
          set +e
          dist/AcousticIRStudio.app/Contents/MacOS/AcousticIRStudio --selftest
          code=$?
          cat "$HOME/Library/Application Support/AcousticIRStudio/logs/app.log" 2>/dev/null | tail -40
          exit $code

      - name: Zip
        run: |
          PKG="Acoustic IR Studio (Mac)"
          mkdir "$PKG"
          cp -R dist/AcousticIRStudio.app "$PKG/Acoustic IR Studio.app"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "$PKG/"
          cp docs/USER_GUIDE.md "$PKG/USER_GUIDE.md"
          cat > "$PKG/HOW TO OPEN.txt" <<'TXT'
          Acoustic IR Studio for Mac - first time you open it

          This free app isn't registered with Apple, so macOS asks you to confirm it once:
          1. Drag "Acoustic IR Studio" into your Applications folder (optional), then double-click it.
             macOS says it can't verify the app - click Done.
          2. Open System Settings > Privacy & Security, scroll down, and click "Open Anyway"
             next to Acoustic IR Studio. Confirm with your password if asked.
          3. When the app asks to use the microphone, click Allow (it needs this to hear your
             instrument and mics).
          From then on it opens normally. In the app, Setup > Driver type should be "Core Audio".
          TXT
          ditto -c -k --keepParent "$PKG" "AcousticIRStudio-mac-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 3
          name: AcousticIRStudio-mac-${{ matrix.arch }}
          path: AcousticIRStudio-mac-${{ matrix.arch }}.zip

  release:
    # only after the tests and the build passed, and only for main
    needs: [build-windows, build-mac]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # the only job that can write to the repository
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: AcousticIRStudio-*
          merge-multiple: true
      - name: Publish the release (new tag; earlier releases stay available)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          sha="${GITHUB_SHA::7}"
          notes="Version $VERSION, built from commit $sha.

          **Windows:** download **AcousticIRStudio-windows.zip**, unzip it, and run **AcousticIRStudio.exe**.
          If Windows says 'Windows protected your PC', click More info -> Run anyway (the app isn't code-signed yet).
          To update, unzip the new one over the old folder - your projects, autosaves and settings are kept.

          **Mac:** download **AcousticIRStudio-mac-apple-silicon.zip** (Macs from 2020 on, M1 and later) or
          **AcousticIRStudio-mac-intel.zip** (older Intel Macs), unzip it, and follow *HOW TO OPEN.txt*:
          the first time, double-click the app, click Done, then System Settings > Privacy & Security >
          **Open Anyway**. Allow the microphone when asked."
          ls -la *.zip
          gh release create "v$VERSION" *.zip --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Version $VERSION" --notes "$notes" --latest
